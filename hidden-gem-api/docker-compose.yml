version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: hidden_gem_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hidden_gem_db
      POSTGRES_USER: hidden_gem_user
      POSTGRES_PASSWORD: hidden_gem_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hidden_gem_user -d hidden_gem_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: hidden_gem_api
    restart: unless-stopped
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
